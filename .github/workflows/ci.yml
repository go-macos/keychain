name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: darwin (real Keychain round-trips, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Vet
        # -unsafeptr is disabled: reading Security.framework's kSec* data
        # symbols (CFStringRef) via purego needs an unavoidable uintptr->Pointer
        # deref the analyzer over-flags. All other unsafe uses go through
        # unsafe.Slice.
        run: CGO_ENABLED=0 go vet -unsafeptr=false ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test (CGO=0, on-device store/get/update/delete round-trips)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (OS-independent logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  linux:
    name: linux (stub build + OS-independent tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Vet
        # -unsafeptr is disabled: reading Security.framework's kSec* data
        # symbols (CFStringRef) via purego needs an unavoidable uintptr->Pointer
        # deref the analyzer over-flags. All other unsafe uses go through
        # unsafe.Slice.
        run: CGO_ENABLED=0 go vet -unsafeptr=false ./...
      - name: Test (stub + pure logic)
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Race (pure logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (stub build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Build stub
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Test (stub + pure logic)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

  crossbuild:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS targets: the real purego backend must compile on both.
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          # The six 64-bit pure-Go targets build the non-darwin stub.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: s390x }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Cross-compile (CGO=0)
        run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
